# Canonical SDK surface. Each SDK's naming-lint asserts it exposes these.
version: 1
client:
  constructors: [Client, AsyncClient]   # R: tl_client
  options: [api_key, base_url, environment, timeout, max_retries, proxy_url, user_agent]
  env_vars: [TOPOLAB_API_KEY, TOPOLAB_BASE_URL, TOPOLAB_ENV]
  env_var: TOPOLAB_API_KEY   # (kept for back-compat; see env_vars)
  default_base_url: https://api.topolab.nl
  # Named API environments. Production ships as the default.
  environments:
    production: https://api.topolab.nl
    staging: https://api.topolab.dev
  # base_url resolution precedence (most specific first):
  base_url_precedence: [base_url, environment, TOPOLAB_BASE_URL, TOPOLAB_ENV, default_base_url]
methods:
  - name: dataset            # handle factory; R: tl_dataset
    params: [slug]
  - name: datasets.list      # R: tl_datasets
    params: [page, limit, search, theme, country, sort_by, sort_order]
  - name: metadata           # R: tl_metadata
    params: [locale]
  - name: sample             # R: tl_sample
    params: [format]
  - name: to_geojson         # TS: toGeoJSON ; R: tl_geojson
    params: []
  - name: download           # R: tl_download
    params: [path, format]
  - name: to_geodataframe    # Python [geo] ; R: as_sf ; TS: n/a
    params: []
  - name: items              # R: tl_items
    params: [bbox, limit, offset, category, city, country]
  - name: iter_items         # TS: iterItems ; R: tl_items_all
    params: [page_size, total_limit, bbox, category, city, country]
  # --- Backend integration: pull what you own, on your own schedule ---
  - name: datasets.owned     # TS: datasets.owned ; R: tl_datasets_owned ; Go: Datasets.Owned
    params: [limit, offset]
  - name: iter_owned         # TS: iterOwned ; R: tl_datasets_owned_all ; Go: IterOwned
    params: [page_size, total_limit]
  - name: archives           # R: tl_archives ; Go: Archives
    params: []
  - name: archive            # download one monthly archive; R: tl_archive ; Go: Archive
    params: [path, month, format]
  - name: coordinates        # R: tl_coordinates ; Go: Coordinates
    params: [limit, offset]
  - name: sql                # client-level, Enterprise only; R: tl_sql ; Go: SQL
    params: [sql, max_rows]
errors:
  - {name: TopolabError,             base: true}
  - {name: AuthenticationError,      status: 401}
  - {name: AddonRequiredError,       status: 403, when: "addon missing"}
  - {name: AccessDeniedError,        status: 403, when: "unknown/unauthorized dataset on data route"}
  - {name: InsufficientCreditsError, status: 402}
  - {name: NotFoundError,            status: 404}
  - {name: ConfigurationError,       status: 400, when: "non-org key on OGC"}
  - {name: RateLimitError,           status: 429}
  - {name: QueryTimeoutError,        status: 408, when: "SQL exceeded the server time limit"}
  - {name: ValidationError,          status: 4xx}
  - {name: ServerError,              status: 5xx}
  - {name: ConnectionError,          status: network}
# Fields every error built from an HTTP response exposes, spelled idiomatically
# per SDK (see conventions.md, "Fields on every SDK error"). Classes above are
# chosen from the HTTP status; `code` only refines the meaning inside a class.
error_fields:
  status: "HTTP status, always an integer (Python also status_code, TS also statusCode, Go StatusCode)"
  code: "envelope code: an upper-snake string such as SPENDING_LIMIT_EXCEEDED, else the numeric HTTP status"
  details: "allow-listed details object when the envelope carries one, else absent"
  request_id: "X-Request-Id header, falling back to the envelope's requestId"
# String codes the SDK surface can return (HTTP status they come with).
error_codes:
  SPENDING_LIMIT_EXCEEDED: {status: 403, details: [limit, consumed, remaining, periodEnd]}
  SQL_DATA_ERROR: {status: 400}
  MAX_NODES_EXCEEDED: {status: 400}
  MAX_DEPTH_EXCEEDED: {status: 400}
  MAX_ARRAY_LENGTH_EXCEEDED: {status: 400}
  MAX_KEYS_EXCEEDED: {status: 400}
  PROTOTYPE_POLLUTION_KEY: {status: 400}
  RATE_LIMIT_EXCEEDED: {status: 429, details: [retryAfter, limit, remaining, resetAt], header: Retry-After}
  USAGE_QUOTA_EXCEEDED: {status: 429, details: [quota, used]}
  SQL_FUNCTION_NOT_ALLOWED: {status: 400}
  QUERY_TOO_EXPENSIVE: {status: 400}
  BUSY: {status: 503, details: [retryAfter], header: Retry-After, reasons: [ORGANIZATION_LIMIT, FLEET_LIMIT, SLOT_STORE_UNAVAILABLE]}
  FILE_PREPARING: {status: 503, details: [retryAfter, linkRoute], header: Retry-After}
  FILE_BUILD_FAILED: {status: 503, details: [retryAfter, linkRoute], header: Retry-After}
  FILE_TOO_LARGE: {status: 413, details: [linkRoute]}
# download() and archive() through the link route (conventions.md,
# "Downloading files").
downloads:
  link_route: POST /v1/dataset/{table}/exports
  bodies:
    download: {format: format, bundle: file}
    archive: {format: format, month: month, bundle: zip}
  signed_url_request: {sends_api_key: false, sends_accept: false, query_in_logs_or_errors: false}   # Accept: JavaScript
  poll: {wait_from: [retryAfterSeconds, Retry-After header], default_seconds: 5, min_seconds: 1, max_wait_seconds: 1800, gives_up_with: FILE_PREPARING}
  fallback_on_status: [404, 405]          # decided on every call, never remembered
  fallback_routes:
    download: GET /v1/dataset/{table}/files/{format}
    archive: GET /v1/dataset/{table}/archives/{month}/{format}
  never_fallback_on: [400, 401, 402, 403, 5xx]
  # The 200's documents (signed, fetched without the API key) beside a plain file; a zip holds them itself.
  documents:
    beside: download                       # archive() writes the zip only
    columns: "{file}.columns.json"
    notices: "{file}.notices/{name}"
    notice_name: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"   # any other name is skipped
    on_fetch_error: fail_call
  build_states: [preparing, ready, failed, superseded]   # GET /v1/dataset/exports/{buildId}; superseded: ask the link route again
# 429 wait, most specific first; none of them means exponential backoff.
retry_after_sources: [Retry-After header, details.retryAfter, retryAfter]
# Per-key rate limit (requests per minute) by plan, and its response headers.
api_key_rate_limit:
  per_minute: {free: 60, team: 300, enterprise: 1000}
  headers: [X-RateLimit-Limit-ApiKey, X-RateLimit-Remaining-ApiKey, X-RateLimit-Reset-ApiKey]
