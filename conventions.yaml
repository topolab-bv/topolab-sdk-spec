# Canonical SDK surface. Each SDK's naming-lint asserts it exposes these.
version: 1
client:
  constructors: [Client, AsyncClient]   # R: tl_client
  options: [api_key, base_url, environment, timeout, max_retries, proxy_url, user_agent]
  env_vars: [TOPOLAB_API_KEY, TOPOLAB_BASE_URL, TOPOLAB_ENV]
  env_var: TOPOLAB_API_KEY   # (kept for back-compat; see env_vars)
  default_base_url: https://api.topolab.nl
  # Named API environments. Production ships as the default.
  environments:
    production: https://api.topolab.nl
    staging: https://api-staging.topolab.nl
  # base_url resolution precedence (most specific first):
  base_url_precedence: [base_url, environment, TOPOLAB_BASE_URL, TOPOLAB_ENV, default_base_url]
methods:
  - name: dataset            # handle factory; R: tl_dataset
    params: [slug]
  - name: datasets.list      # R: tl_datasets
    params: [page, limit, search, theme, country, sort_by, sort_order]
  - name: metadata           # R: tl_metadata
    params: [locale]
  - name: sample             # R: tl_sample
    params: [format]
  - name: to_geojson         # TS: toGeoJSON ; R: tl_geojson
    params: []
  - name: download           # R: tl_download
    params: [path, format]
  - name: to_geodataframe    # Python [geo] ; R: as_sf ; TS: n/a
    params: []
  - name: items              # R: tl_items
    params: [bbox, limit, offset, category, city, country]
  - name: iter_items         # TS: iterItems ; R: tl_items_all
    params: [page_size, total_limit, bbox, category, city, country]
  # --- Backend integration: pull what you own, on your own schedule ---
  - name: datasets.owned     # TS: datasets.owned ; R: tl_datasets_owned ; Go: Datasets.Owned
    params: [limit, offset]
  - name: iter_owned         # TS: iterOwned ; R: tl_datasets_owned_all ; Go: IterOwned
    params: [page_size, total_limit]
  - name: archives           # R: tl_archives ; Go: Archives
    params: []
  - name: archive            # download one monthly archive; R: tl_archive ; Go: Archive
    params: [path, month, format]
  - name: coordinates        # R: tl_coordinates ; Go: Coordinates
    params: [limit, offset]
  - name: sql                # client-level, Enterprise only; R: tl_sql ; Go: SQL
    params: [sql, max_rows]
errors:
  - {name: TopolabError,             base: true}
  - {name: AuthenticationError,      status: 401}
  - {name: AddonRequiredError,       status: 403, when: "addon missing"}
  - {name: AccessDeniedError,        status: 403, when: "unknown/unauthorized dataset on data route"}
  - {name: InsufficientCreditsError, status: 402}
  - {name: NotFoundError,            status: 404}
  - {name: ConfigurationError,       status: 400, when: "non-org key on OGC"}
  - {name: RateLimitError,           status: 429}
  - {name: QueryTimeoutError,        status: 408, when: "SQL exceeded the server time limit"}
  - {name: ValidationError,          status: 4xx}
  - {name: ServerError,              status: 5xx}
  - {name: ConnectionError,          status: network}
